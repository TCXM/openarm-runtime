<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenArm · Camera Viewer</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#ffffff;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit;background:#ffffff;border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;cursor:pointer}button{background:#2563eb;color:#ffffff;border-color:#2563eb}button:hover{background:#1d4ed8}button:focus-visible,select:focus-visible{outline:2px solid #779fff;outline-offset:3px}header{height:58px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#ffffff}header strong{font-size:16px}header span{color:#64748b;font-size:12px}.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 58px)}aside{padding:24px 18px;background:#ffffff;border-right:1px solid #e2e8f0}h1{font-size:20px;margin:0 0 8px}p{color:#64748b;line-height:1.65}h2{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#64748b;margin:28px 0 14px}.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.field select{max-width:146px}aside button{width:100%;margin-top:10px}input{accent-color:#2563eb}.source{display:flex;align-items:center;justify-content:space-between;margin:20px 0;gap:8px}.status{font-size:12px;color:#64748b}.status[data-online=true]{color:#15803d}.status:before{content:'●';margin-right:6px}.hint{font-size:12px;border-top:1px solid #e2e8f0;padding-top:18px;margin-top:28px}main{padding:22px;min-width:0;background:#ffffff}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.toolbar p{margin:5px 0 0;font-size:12px}.tag{font-size:11px;border:1px solid #bfdbfe;border-radius:5px;padding:5px 8px;color:#2563eb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid #e2e8f0;border-radius:9px;overflow:hidden;background:#ffffff;min-width:0}.card.head{grid-column:1 / -1;max-width:100%}.card header{height:45px;padding:0 14px;background:#ffffff}.card header strong{font-size:13px}.card button{font-size:12px;padding:4px 9px}.viewport{position:relative;background:#ffffff;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.head .viewport{aspect-ratio:4/3;max-height:47vh}.viewport img{height:100%;width:100%;object-fit:contain;position:absolute;inset:0}.placeholder{z-index:1;color:#64748b;background:#f1f5f9;padding:12px 20px;border-radius:6px;pointer-events:none}.card footer{display:flex;justify-content:space-between;padding:10px 14px;color:#64748b;font-size:11px}.grid.single{grid-template-columns:1fr}.grid.single .viewport{max-height:72vh}.card[hidden]{display:none}.card:fullscreen{width:100%;height:100%;display:flex;flex-direction:column}.card:fullscreen .viewport{flex:1;max-height:none}.muted{color:#64748b}.error{color:#a16207}a{color:#2563eb}@media(min-width:1450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.head{grid-column:1;grid-row:1 / 3}.head .viewport{max-height:none;height:calc(100% - 79px)}}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e2e8f0;padding:16px}aside h2,aside .hint{display:none}.source{display:inline-flex;margin:12px 18px 0 0}.field{display:inline-flex;margin-right:18px}aside button{width:auto}h1{font-size:18px}.grid{grid-template-columns:1fr}.card.head{grid-column:auto}.head .viewport{max-height:none}main{padding:14px}header span{display:none}}

.card.head{grid-column:auto;grid-row:auto}.head .viewport,.depth .viewport{aspect-ratio:4/3;max-height:none;height:auto}
input[type=number]{width:95px;padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
.download{display:block;background:#2563eb;color:white;text-align:center;padding:10px;border-radius:6px;text-decoration:none}.download:hover{background:#1d4ed8}
#depth-stats{font-size:12px}.scale{height:7px;background:linear-gradient(to right,#7a0403,#f9ba38,#a4fc3c,#1bcfd4,#466be3,#30123b)}
.viewport img[hidden],.placeholder[hidden]{display:none}.card:fullscreen .viewport{height:100%;max-height:none}

#simulation{background:#fff3cd;color:#744d00;padding:12px 22px;font-weight:700;border-bottom:1px solid #f0cf73}.viewport{aspect-ratio:var(--aspect,16/9)}
</style>
</head>
<body>
<header><strong>◈ OpenArm <span> / Camera Viewer</span></strong><span>视觉工作台</span></header>
<div id="simulation" hidden>SIMULATION · 模拟画面，不是实体相机</div>
<div class="shell">
<aside><h1>相机视图</h1><p>RGB 与深度相机<br>在一个工作台中查看。</p>
<h2>Display / 显示</h2>
<label class="field">布局<select id="layout"><option value="all">全部同屏</option></select></label>
<label class="field">镜像预览<input type="checkbox" id="mirror"></label>
<button id="pause">暂停预览</button><button id="reconnect">重新连接画面</button>
<h2>Sources / 连接状态</h2><div id="sources" aria-live="polite"></div>
<section id="depth-controls" hidden><h2>Depth / 深度</h2>
<label class="field">深度相机<select id="depth-source"></select></label>
<label class="field">近端（米）<input id="near" type="number" min="0" max="19.9" step="0.1" value="0.3"></label>
<label class="field">远端（米）<input id="far" type="number" min="0.1" max="20" step="0.1" value="4"></label>
<a class="download" href="/depth.png?raw=1">下载原始深度图</a>
<p id="depth-stats" aria-live="polite">等待深度数据…</p></section>
<p class="hint">RGB 预览上限约 20 FPS，深度约 10 FPS。黑色深度像素表示无效测量。各路未做硬件同步，RGB 与深度未配准。<br><br>布局参考 <a href="https://github.com/mujocolab/mjviser" target="_blank" rel="noreferrer">mjviser</a>。</p>
</aside>
<main><div class="toolbar"><div><strong id="view-title">全部相机</strong><p id="summary" role="status">正在获取设备状态…</p></div><span class="tag" id="mode">LIVE VIEW</span></div><div class="grid" id="grid"></div></main>
</div>
<script src="/static/viewer.js" defer></script>
</body></html>
