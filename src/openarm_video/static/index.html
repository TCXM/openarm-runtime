<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenArm · 相机</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26312e;background:#f5f6f5;font-size:14px}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select,input{font:inherit}button,select{color:inherit;background:#fff;border:1px solid #dce2de;border-radius:8px;padding:8px 12px}button,summary{cursor:pointer}button:hover{background:#edf1ee}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #39755b;outline-offset:3px}body>header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 28px;background:#fff;border-bottom:1px solid #e3e7e4}header strong{font-weight:600}header small{color:#7a857f;margin-left:12px}.actions{display:flex;align-items:center;gap:8px}.tag{font-size:11px;letter-spacing:.08em;color:#39755b}main{max-width:1600px;margin:auto;padding:22px 28px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.toolbar strong{font-size:16px;font-weight:500}.toolbar p{margin:5px 0 0;color:#7a857f;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.grid.has-head{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.grid.has-head .primary{grid-row:span 2}.grid.single{grid-template-columns:minmax(0,1fr);max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #e0e5e1;border-radius:12px;overflow:hidden;min-width:0}.card header{display:flex;align-items:center;gap:10px;padding:10px 14px}.card header strong{font-size:13px;margin-right:auto}.card header button{font-size:12px;padding:4px 8px;border:0;color:#7a857f}.viewport{position:relative;aspect-ratio:var(--aspect,16/9);background:#111815;display:flex;align-items:center;justify-content:center;overflow:hidden}.viewport img{width:100%;height:100%;object-fit:contain}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111815b8;color:#e3e9e5;font-size:13px;padding:20px;text-align:center}.card footer{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:11px;color:#7a857f}.status{font-size:11px;color:#8b7260;white-space:nowrap}.status:before{content:'●';font-size:8px;margin-right:5px}.status[data-online=true]{color:#39755b}.card:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0;background:#111815}.card:fullscreen header,.card:fullscreen footer{background:#fff}.card:fullscreen .viewport{flex:1;aspect-ratio:auto;min-height:0}.card:fullscreen .viewport img{position:absolute;inset:0}.settings{margin-top:20px;color:#68766e;font-size:12px}.settings>summary{width:fit-content;padding:8px 0}.settings-body{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0}.field{display:flex;align-items:center;gap:10px;margin:8px 0}.field input[type=number]{width:80px;padding:6px;border:1px solid #dce2de;border-radius:6px}.source{display:flex;justify-content:space-between;gap:24px;margin:8px 0}.download{color:#39755b}#depth-stats,.hint{font-size:12px;line-height:1.7;color:#7a857f}.scale{height:4px;background:linear-gradient(to right,#7a0403,#f9ba38,#a4fc3c,#1bcfd4,#466be3,#30123b)}#simulation{padding:10px 28px;background:#fff3cd;color:#744d00}input{accent-color:#39755b}
@media(max-width:760px){body>header{padding:16px}header small{display:none}main{padding:16px}.grid,.grid.has-head{grid-template-columns:minmax(0,1fr)}.grid.has-head .primary{grid-row:auto}.toolbar{align-items:flex-start}.actions{gap:6px}.tag{display:none}.card footer{font-size:11px}}
</style>
</head>
<body>
<header><strong>OpenArm <small>相机预览</small></strong><div class="actions"><span class="tag" id="mode">LIVE VIEW</span><button id="pause">暂停预览</button></div></header>
<div id="simulation" hidden>SIMULATION · 模拟画面，不是实体相机</div>
<main>
<div class="toolbar"><div><strong id="view-title">相机预览</strong><p id="summary" role="status">正在获取设备状态…</p></div><select id="layout" aria-label="选择画面"><option value="all">全部相机</option></select></div>
<div class="grid" id="grid"></div>
<details class="settings"><summary>预览设置</summary><div class="settings-body"><section><label class="field">镜像预览<input type="checkbox" id="mirror"></label><label class="field" id="depth-toggle" hidden>显示深度<input type="checkbox" id="show-depth"></label><button id="reconnect">重新连接画面</button></section><div id="sources"></div>
<section id="depth-controls" hidden><label class="field">深度相机<select id="depth-source"></select></label><label class="field">近端（米）<input id="near" type="number" min="0" max="19.9" step="0.1" value="0.3"></label><label class="field">远端（米）<input id="far" type="number" min="0.1" max="20" step="0.1" value="4"></label><a class="download" href="/depth.png?raw=1">下载原始深度图</a><p id="depth-stats">等待深度数据…</p></section></div><p class="hint">FPS 为浏览器画面更新率。后台标签页自动暂停预览。各路未做硬件同步，RGB 与深度未配准。</p></details>
</main>
<script src="/static/viewer.js" defer></script>
</body></html>
