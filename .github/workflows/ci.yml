name: Package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Test installed core outside checkout
        env:
          OPENARM_EXPECT_INSTALLED: '1'
        run: |
          python -m venv "$RUNNER_TEMP/runtime-test"
          "$RUNNER_TEMP/runtime-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests"
          "$RUNNER_TEMP/runtime-test/bin/python" "$GITHUB_WORKSPACE/examples/read_leader.py" --help
          "$RUNNER_TEMP/runtime-test/bin/python" "$GITHUB_WORKSPACE/examples/read_follower.py" --help
      - name: Test optional platform and gravity from installed wheel
        env:
          OPENARM_EXPECT_INSTALLED: '1'
        run: |
          "$RUNNER_TEMP/runtime-test/bin/python" - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[platform,gravity]'], check=True)
          PY
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_platform*.py'
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_gravity.py'
      - name: Test optional video from installed wheel
        env:
          OPENARM_EXPECT_INSTALLED: '1'
        run: |
          "$RUNNER_TEMP/runtime-test/bin/python" - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[video]'], check=True)
          PY
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_video*.py'
          "$RUNNER_TEMP/runtime-test/bin/python" "$GITHUB_WORKSPACE/examples/read_video.py" --help
      - name: Test optional tactile SDK from installed wheel
        env:
          OPENARM_EXPECT_INSTALLED: '1'
        run: |
          "$RUNNER_TEMP/runtime-test/bin/python" - <<'PYCODE'
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[tactile]'], check=True)
          PYCODE
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_tactile.py'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
