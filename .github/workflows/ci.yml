name: Package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Test installed core outside checkout
        env:
          OPENARM_EXPECT_INSTALLED: '1'
        run: |
          python -m venv "$RUNNER_TEMP/runtime-test"
          "$RUNNER_TEMP/runtime-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests"
          "$RUNNER_TEMP/runtime-test/bin/python" "$GITHUB_WORKSPACE/examples/read_leader.py" --help
          "$RUNNER_TEMP/runtime-test/bin/python" "$GITHUB_WORKSPACE/examples/read_follower.py" --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
