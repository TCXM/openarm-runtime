[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-runtime"
version = "0.6.0"
description = "Reusable OpenArm Classic CAN control, Feetech leader readout, tactile/video capture and optional Viser tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "Yuxiao Zhu"}]
keywords = ["robotics", "openarm", "socketcan", "feetech", "viser"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/TCXM/openarm-runtime"
Issues = "https://github.com/TCXM/openarm-runtime/issues"
Changelog = "https://github.com/TCXM/openarm-runtime/blob/main/CHANGELOG.md"

[project.optional-dependencies]
platform = ["nicegui==3.18.0", "aiohttp==3.14.5"]
leader = ["feetech-servo-sdk==1.0.0", "pyserial==3.5"]
viewer = ["viser[urdf]==1.1.1", "pycollada==0.9.3"]
tactile = [
  "paxini-sdk @ git+https://github.com/Jingyi-Z/paxini-sdk.git@79c82145f88e158dd7706736e8c07f14f11cbd7a",
  "pyserial==3.5",
]
video = ["opencv-python-headless==4.13.0.92", "numpy==2.5.4", "Flask==3.1.3"]
follower = [
  "openarm-can @ git+https://github.com/enactic/openarm_can.git@bfd4e52194aefe38389fa6e670be3738136facb9#subdirectory=python",
  "nanobind==2.10.2",
  "scikit-build-core==1.1.1",
]

[project.scripts]
openarm-runtime = "openarm_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
no-build-isolation-package = ["openarm-can"]

[tool.setuptools.package-data]
openarm_video = ["static/*.html", "static/*.js", "native/*.cpp"]

openarm_platform = ["static/*.css"]
